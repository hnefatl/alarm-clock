[package]
name = "alarm_clock"
edition = "2024"
rust-version = "1.96"
version = "0.1.0"

[dependencies]
lib = { path = "../lib" }
esp-hal = { version = "1.2", features = ["defmt", "esp32s3", "unstable"] }
defmt = "1"
static_cell = "2"
esp-println = { version = "0", features = ["defmt-espflash", "esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32s3"] }
esp-alloc = { version = "0.11.0", features = ["defmt"] }
esp-backtrace = { version = "0.20", features = [
  "defmt",
  "esp32s3",
  "panic-handler",
] }
esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }
embassy-executor = { version = "0.10", features = ["defmt"] }
embedded-hal = "1"
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp32s3",
  "wifi",
  "defmt",
  "unstable",
] }
embassy-net = { version = "0.9", features = [
  "defmt",
  "medium-ethernet",
  "icmp",
  "auto-icmp-echo-reply",
  "udp",
  "tcp",
  "dns",
  "dhcpv4",
  "dhcpv4-hostname",
  "proto-ipv4",
  # embassy-net IPv6 stack currently only ~really supports holding a single active
  # address at a time, and it picks link-local or ULA more than GUA, so is basically
  # useless.
  # Seems like this might be fixed in https://github.com/embassy-rs/embassy/issues/6796?
  # TODO: re-enable in the future
  #"proto-ipv6",
  #"slaac",
  "alloc",
] }
embassy-time = "0.5.1"
embassy-futures = "0.1"
embassy-sync = "0.8"
esp-sync = "0.3"
sntpc = { version = "0.11", features = ["defmt"] }
sntpc-time-embassy = "0.6"
sntpc-net-embassy = { version = "0.11", features = [
  # TODO: re-enable, see above
  #"ipv6"
] }
anyhow = { version = "1", default-features = false }
heapless = { version = "0.9", features = ["defmt"] }
time = { version = "0.3", default-features = false }
core-s3 = { version = "0.5", features = ["defmt", "esp-hal"] }
serde-json-core = { version = "0.7", features = [
  "defmt",
  "custom-error-messages",
] }

# Copied from esp-generate templates.
[profile.dev]
opt-level = 3
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
