[package]
edition = "2024"
name = "alarm_clock"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "alarm_clock"

[dependencies]
esp-hal = { version = "~1.0", features = ["defmt", "esp32s3", "unstable"] }
defmt = "1.0.1"
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32s3"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32s3"] }
esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-backtrace = { version = "0.18.1", features = [
  "defmt",
  "esp32s3",
  "panic-handler",
] }
esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embedded-hal = "1.0"

# Copied from esp-generate templates.
[profile.dev]
opt-level = "s"
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
